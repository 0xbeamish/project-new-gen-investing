[project]
name = "project-new-gen-investing"
version = "0.1.0"
description = "Point-in-time signal research for numbers and text: one scorer, a registry of every test, loops that know which loop owns an error"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "lxml>=6.1.3",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
]

[project.optional-dependencies]
llm = [
    "anthropic>=1.11.0",   # Claude readers, labelers, proposers, deciders
    "typesafe-sdk>=0.7.2", # Jev readers and deciders
]

[project.scripts]
engine = "engine.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/engine"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
