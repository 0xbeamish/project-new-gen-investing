# Crypto: the most-traded Binance USDT pairs, weekly, with DeFiLlama fees, perp funding and hacks.
# All free, no keys. `engine build --fetch --market crypto` fills .cache/crypto (Binance's public
# archive keeps delisted pairs, so dead tokens stay in the universe). Plug-in: engine.markets.crypto.
plugin: crypto
data_end: "2024-12-31"       # bars, fees, funding and hacks after this are never read: 2025+ stays unseen

calendar: {kind: continuous, close: "23:59", decide_after_close: 1min}   # Binance daily bars close 23:59:59 UTC
schedule: weekly             # decisions Monday 00:00 UTC
t_stat_lags: auto            # added 2026-10-13: every t is at most its Newey-West t (bull/bear streaks)
labels:
  horizon: 7                 # one week of daily bars
  ended_if_no_bar_for_days: 10
  delisted_return: -0.30     # added to a window cut short by delisting (as for stocks)
  beta_adjust: {days: 90, shrink: 0.667}   # added 2026-10-13: IC and model target use the return
                             #   minus beta x the market's (equal weight) move; books keep raw returns

universe:
  top: 100                   # by mean daily USDT volume over the last 30 bars before the decision
  volume_days: 30
  min_history_bars: 90       # listed at least ~3 months (new listings have no features yet)
  exclude: [USDC, BUSD, TUSD, USDP, PAX, DAI, FDUSD, UST, USTC, SUSD, USDS, USDSB, EUR, GBP, AUD,
            BRL, TRY, PAXG, WBTC, BETH, BKRW, BIDR, IDRT, BVND, UAH, ZAR, NGN, RUB, AEUR, EURI,
            USD1, USDE, XUSD, BFUSD, RLUSD]   # stablecoins, fiat, gold, wrapped copies
  renamed: [NPXS, BCHABC, LEND, ERD, BTT, MATIC, MC, OCEAN, AGIX, RNDR, KEEP, NU, TOMO, GAL, KLAY]
  # a renamed / migrated pair ends without the delisting penalty (its last window runs to the last bar)
  sectors: markets/crypto_sectors.csv   # group = sector: returns are sector-adjusted (added 2026-10-07)
  gap_days: 10               # a pair with no bar for 10+ days is split: the part after the gap is a
                             #   new entity (Binance reused LUNAUSDT for a different token in 2022)

costs:
  taker_fee_bps: 10          # Binance spot, per side, no discount
  trade_usd: 10000           # + square-root impact per side: daily return sd x sqrt(trade / mean
  impact_days: 30            #   daily USDT volume), both over the last 30 bars before the decision

sources:
  price:
    features: [px_mom_1w, px_mom_4w, px_mom_12w, px_vol_4w, px_log_dvol]
  funding:
    features: [funding_7d]
  fees:
    features: [fee_vs_price_90d, fee_growth_90d]
  hacks:
    features: [hack_usd_30d]
  growth:
    features: [px_volume_growth_90d, dex_volume_growth_90d]
  positioning:               # added 2026-10-07: upstream of price (leverage, trader positioning)
    features: [oi_to_mcap, oi_to_volume, oi_growth_30d, account_long_short_7d,
               top_trader_long_short_7d, taker_buy_sell_7d]
  flows:
    features: [chain_stablecoins_growth_90d]
  attention:
    features: [wiki_views_growth_30d]

features:
  baseline: [px_mom_1w, px_mom_4w, px_mom_12w, px_vol_4w, px_log_dvol]
  all: ["@baseline", funding_7d, fee_vs_price_90d, fee_growth_90d, hack_usd_30d]
  everything: ["@baseline", funding_7d, fee_vs_price_90d, fee_growth_90d, hack_usd_30d,
               px_volume_growth_90d, dex_volume_growth_90d, "@upstream"]   # descriptive only
  upstream: [oi_to_mcap, oi_to_volume, oi_growth_30d, account_long_short_7d, top_trader_long_short_7d,
             taker_buy_sell_7d, chain_stablecoins_growth_90d, wiki_views_growth_30d, funding_7d]

model:
  name: ridge
  alpha: 10.0
  block: Q                   # refit each quarter
  min_train_periods: 26      # half a year of weeks before the first prediction

portfolio:
  band: {enter: 0.8, exit: 0.6}   # buy the top 20%, hold until it leaves the top 40%

periods:                     # fixed before any result was computed
  tuning: ["2021-01-01", "2024-01-01"]
  check: ["2024-01-01", "2025-01-01"]
  holdout_start: "2025-01-01"

registry:
  file: data/engine/crypto/registry.csv   # its own count (decided 2026-10-06, see the amendment)
  planned: 3                 # the three pre-registered tests each face the bar of the third: t >= 2.394
  check_limit: 30
  holdout_unlock_log: data/engine/crypto/holdout_unlocks.csv

discovery:
  transforms: [level]
  candidates: [funding_7d, fee_vs_price_90d, hack_usd_30d]
  max_tests: 3

loop:
  features: all
  refit: M

# PRE-REGISTRATION (committed before any panel was built or any return computed).
# Three judged tests, in this order, each `engine test --market crypto --feature <f>` (level,
# universal), each logged whatever the result, each run only after the owner says yes:
#   1. funding_7d         mean perp funding rate over the 7 days before the decision.
#                         Hypothesis: NEGATIVE (crowded, paying longs underperform next week).
#   2. fee_vs_price_90d   log growth of 30-day protocol fees over 90 days minus log price growth
#                         over the same 90 days (fees outgrew price = cheaper). Hypothesis: POSITIVE.
#                         DeFiLlama has no free market-cap history, so this replaces fees/market cap.
#   3. hack_usd_30d       log(1 + USD lost to hacks of the token's protocol in the last 30 days).
#                         Hypothesis: NEGATIVE (post-hack drift). Sparse: expect a large MDE.
# Each is judged against the baseline (price momentum 1/4/12 weeks, 4-week volatility, log dollar
# volume): the statistic is the per-week gain in rank IC over the baseline, t over tuning weeks,
# which must reach the registry's bar at run time (2.394 after the amendment below). A sign opposite to the
# hypothesis is reported as such, never re-tested. fee_growth_90d is descriptive only.
# Known weaknesses, accepted up front:
#   - DeFiLlama revises past fees (new adapters are back-filled), so old fee values are what is known
#     now, not what was known then; fees are stamped usable a day after the day ends.
#   - The universe is Binance-listed tokens only, and pair renames not in `renamed` count as delistings.
#   - A token swap that re-scales the price inside one pair shows as a fake return; rank IC (the
#     judged statistic) is robust to it, portfolio returns are not.
#   - Text (Reddit, X, governance) is not here: an AI reader remembers 2021-2024, so text is tested
#     forward only, from data collected from now on.
#
# AMENDMENT 2026-10-06, after the panel was built and before any test (no candidate statistic, no
# return of any portfolio looked at):
#   - Costs: the measured-spread estimators (Abdi-Ranaldo, Corwin-Schultz) fail on 24/7 crypto bars
#     (median 0 and 255 bp on the top-100 pairs, whose real spreads are a few bp). Replaced by 2 x
#     (taker fee + square-root impact of a $10k trade): median ~46 bp round trip. Costs don't enter
#     the judged statistic (rank IC); they set every net portfolio number.
#   - renamed += KEEP, NU (-> T), TOMO (-> VIC), GAL (-> G), KLAY (-> KAIA), found in the list of
#     series that end before data_end.
#   - Power, printed before any test: 117 scored weeks, baseline rank-IC sd 0.170, bar 3.626 ->
#     MDE 0.070 at 80% power, 0.057 at 50% (UNDERPOWERED: above 0.05).
#   - Registry, decided by the owner before any test: crypto keeps its OWN count instead of sharing
#     the stock tests' (bar 3.626, MDE 0.070, above any edge measured so far). The three tests form
#     one family, each judged at the Bonferroni bar for three: t >= 2.394 (MDE ~0.051 at 80% power).


# PRE-REGISTRATION 2 (2026-10-07, committed before any 2024 row was built): two confirmations of
# leads found by exploring 2021-2023 (descriptive, by quarter, by sector; not logged). Each is
# `engine confirm --market crypto --feature <f> --scope <s> --sign <d>`: the feature's own weekly
# rank IC on 2024 ALONE (the check period; one look each), with returns adjusted to the token's
# sector mean that week (group = sector), times the sign; t over the weeks of 2024. Bar: the
# registry's next bar at run time (2.498, then 2.576: they count as tests 4 and 5). Kept if t >= bar.
#   4. dex_volume_growth_90d, scope L1, sign +1: L1 tokens whose DEX volume (last 30 days vs the 30
#      days ending 90 days earlier; the protocol's, else the chain's) grew beat other L1s next week.
#      Explored: L1 winners +10% vs losers -51% in the prior quarter (41 vs 32 token-quarters).
#   5. px_volume_growth_90d, universal, sign -1: tokens whose USDT trading volume (same windows)
#      surged underperform their sector next week. Explored: rank corr -0.08, t -1.77 (12 quarters).
# Exploration used quarterly returns; here the horizon stays one week (52 independent weeks beat
# 4 overlapping quarters for power; a slow signal should show up in every week).

# PRE-REGISTRATION 3 (2026-10-08, committed before any 2024 row of these inputs was built): two
# positioning leads, each `engine confirm --market crypto --feature <f> --sign -1 --net baseline`:
# the feature's weekly rank IC on 2024 ALONE (one check look each), AFTER removing what the price
# baseline already says (each week, the feature's rank minus its least-squares fit on the ranks of
# px_mom_1w, px_mom_4w, px_mom_12w, px_vol_4w, px_log_dvol), against sector-adjusted next-week
# returns, times the sign; t over the weeks of 2024. Universal scope. Bar: the registry's next bar at
# run time (2.638, then 2.690: tests 6 and 7). Kept if t >= bar. Power at ~75 tokens a week and 52
# weeks: MDE ~0.055 at 80%.
#   6. oi_to_mcap, sign -1: tokens with more perp open interest relative to their market cap
#      (crowded leverage) underperform their sector next week. Basis: chain-token exploration of
#      2021-2023 (monthly, not logged): rank corr -0.10 (t -1.8); winners carried less leverage than
#      losers (gap 0.41 sd); leverage and liquidation research (BIS, "DeFi leverage").
#   7. account_long_short_7d, sign -1: when more Binance accounts are long than short (7-day mean),
#      the token underperforms next week (retail positioning as a contrarian signal). Basis: chain
#      exploration, level t -1.4; the ratio falls as prices rise (same month -0.36), so retail sells
#      into rallies and buys into falls.
# Judging net of the price baseline answers last round's lesson: the kept volume-surge lead (test 5)
# was mostly short-term reversal and low volatility.

# PRE-REGISTRATION 4 (2026-10-10, committed before any 2017-2020 or 2025+ bar was downloaded). ONE
# pooled test of a rule-based strategy, approved by the owner, opening the holdout once:
#   run.pooled_strategy_test(study, "px_vol_4w", sign=-1, enter=0.8, exit=0.4,
#       pre=("2018-01-01", "2021-01-01"), holdout_reason=..., sources=["price"],
#       holdout_study=<this market without data_end>)
#   Strategy: each Monday, rank the 100-token universe (rules above) by -px_vol_4w (calmer = better)
#   within sector (markets/crypto_sectors.csv; unlabelled tokens form "Other"); hold, equal weight,
#   every token ranked above the 80th percentile, keep it while above the 40th; spot, long-only,
#   costs as above (2 x (10 bp + square-root impact of $10k)). No model, no fitting.
#   Periods (never used to choose it): 2018-01-01..2021-01-01 (before tuning), 2024 (the check
#   period; one look), 2025-01-01 to the last complete week (the holdout; opened once, logged).
#   Statistic: weekly net return of the book minus the equal-weight universe, pooled over the three
#   periods (each starts from an empty book); t = mean / (sd / sqrt(weeks)).
#   Kept if t >= the registry's next bar at run time (2.734: test 8) and the mean is positive.
#   Chosen on 2021-2023 (descriptive): +30 bp/week net, t 1.44 over 156 weeks (sd ~260 bp/week).
#   Power: at that effect and ~300 pooled weeks, the expected t is ~2.0, so it passes ~1 time in 4
#   even if real; a miss means "couldn't tell", not "no effect".

# PRE-REGISTRATION 5 (2026-10-11, committed before any perp kline was fetched; v3 as reviewed). ONE long-short
# low-vol test on Binance USDT-M perps. Run: run.pooled_long_short_test (to be built, with tests).
# WEAKER EVIDENCE: every date has been seen.
#   Motivated by the test-8 diagnostic: test 8's excess is not beta-adjusted; this alpha is the question it never asked.
#
# Already known before writing this (exploratory, spot prices as perp proxy, not logged; 2021-2023 unless noted):
#   - tradable.py: 108 variants; best low-vol long-short +37 bp/wk (t 0.91).
#   - combo.py: low-vol long-short, WITHIN SECTOR 0.8/0.4, dollar-neutral: +0.2 bp/wk (t 0.01); its raw return
#     minus BTC (beta forced to 1): -62 bp/wk (t -0.74).
#   - test 8: the long-only calm book vs equal-weight universe, and BTC / equal-weight %/yr, for all periods.
#   - singletons.py (2026-10-10, test-8 diagnostic, descriptive): the long-only calm book ranked ACROSS the
#     universe (spot, all names, not perp-restricted) vs equal-weight: 2018-20 -7.9 bp/wk (t -0.28), 2024 +75.9
#     (t 1.74), 2025-26 +120.5 (t 5.49). That is close to this test's LONG leg on most of its dates.
#   - No universe-wide LONG-SHORT run exists: tradable.py ranks within (decision_time, group) for all 108
#     variants (line 60; top_liquid filters names, ranking stays within sector); combo.py likewise.
#   NO run ever regressed a long-short return on BTC (grep of scratch scripts and session history), so the
#   PRIMARY statistic below is unseen, but partly inferable: alpha ~ mean_LS - beta x mean_BTC. Over 2021-23
#   mean_LS ~0 and BTC's mean ~+62 bp/wk are known, and a low-minus-high-vol book has beta < 0 almost by
#   construction, so the 2021-23 alpha is predictably about |beta| x 62 bp/wk, positive. A pass that rests on
#   2021-23 is therefore mostly this arithmetic; the per-period line below shows whether it does.
#
# Universe: each Monday 00:00 UTC, the top-100 universe restricted to tokens with a USDT-M perp listed at the
#   decision time (first funding record <= decision time <= last funding record).
#
# Rule: rank -px_vol_4w ACROSS the perp-listed universe (not within sector; see coverage below).
#   Long: above the 80th percentile, held while above the 40th.
#   Short: below the 20th, held while below the 60th.
#   Pure vol, no other inputs, no fitting. Differs from the explored within-sector rule.
#
# Coverage, counted before any return (2020-2023 only; no labels read):
#   within sector, a lone name gets rank(pct=True) = 1.0, the top of whatever is ranked (the count ranked +vol,
#   so singletons landed in the short count; ranking -vol puts them in the long leg). Either way the legs were
#   lopsided (median 22 vs 9) and 44 of 52 weeks of 2020 fell below N. Across the universe the legs balance:
#     | year | weeks | median perp-listed | median short | median long | weeks dropped (N=5) |
#     | 2020 |  52   | 28.5 |  6 |  5 | 21 |
#     | 2021 |  52   | 80   | 16 | 15 |  0 |
#     | 2022 |  52   | 77   | 16 | 15 |  0 |
#     | 2023 |  52   | 90   | 18 | 17 |  0 |
#   2024+ counts are printed by the run script BEFORE it reads any return, and appended here as an amendment.
#   N = 5 per leg; weeks below it are dropped and counted.
#
# Returns: perp 1d klines (um/monthly/klines, to be fetched), entry open to exit close, same timing as labels.
#   A perp that stops trading mid-week closes at its last close; never dropped.
#   Funding: each leg's P&L includes -position x rate per 8h record, sign as recorded (long = +1, short = -1);
#   unit test with a negative-rate day.
# Costs, both legs: 2 x (5 bp taker + square-root impact of $10k on spot 30-day dollar volume).
# Sizing: equal weight within each leg, half the capital per leg (dollar-neutral).
#
# Periods: 2020-01-06 to the last complete week, pooled. Re-reading 2025+ goes through holdout.unlock again,
#   logged, and needs Akhil's yes.
#
# PRIMARY (judged): alpha = intercept of OLS of weekly net long-short return on BTC's weekly perp return,
#   same weeks, full-sample beta; t from HC3 standard errors. Kept if t >= the registry's next bar AT RUN TIME
#   (2.773 at 8 judged; read via registry.next_bar()) and alpha > 0. One registry row either way.
#   Full-sample beta uses look-ahead: fine as a test statistic, NOT a tradable hedge. If kept, a
#   trailing-beta-hedged version is a separate, later test.
# Secondary (not judged): dollar-neutral mean and t; alpha with funding removed (below half the full alpha =
#   labelled funding carry); gross, costs and funding as separate lines; alpha and HC3 t PER PERIOD
#   (2020, 2021-23, 2024, 2025-26), each with its own full-period beta.
# Risk: worst week, max drawdown, weeks where the short leg rose > 30%.
#   Not modelled: squeezes, liquidations, margin, position limits, basis.
#
# Power, fixed before running: residual sd after the BTC regression is NOT estimated here (that would reveal the
#   2021-23 alpha). Weeks ~329 (21 of 2020 dropped). HC3 will widen these slightly.
#   | residual sd (bp/wk) | MDE 50% power | MDE 80% power |
#   | 450 (beta explains nothing) | 69 | 90 |
#   | 350 | 54 | 70 |
#   | 250 | 38 | 50 |
#   The run prints the realized residual sd and power before the alpha line. Unless beta absorbs most of the
#   variance, an alpha below ~70-90 bp/wk reads as "couldn't tell", not "no edge".
# AMENDMENT to pre-registration 5 (2026-10-11, before any perp kline was fetched or any return computed):
#   "entry open to exit close, same timing as the labels" was self-contradictory: the labels run close
#   to close (first daily close after the decision -> close `horizon` bars later). The perp legs use the
#   label timing: perp close on the entry date -> perp close on the label_end date (or the last close
#   before it, if the perp stops). Pre-2021 frame: pre=("2020-01-01", "2021-01-01"); each period starts
#   from an empty book, as in test 8. The 2024 frame comes through the gate (one check look).
#
# PRE-REGISTRATION 6 (2026-10-12, before any Jev call on these sets): Jev (jev-1.13.0, TypeSafe) picks
#   from 5 anonymized tokens. Five variants, ONE family: each is judged against required_t(9 + 5) = 2.91.
#   Asked by Akhil after a 5-set demo (0 of 5 winners; descriptive, not logged). TUNING YEARS ONLY.
# Sets: scratchpad jevfam_sets.py, numpy default_rng(20261013): 2000 sets, each a uniformly drawn decision
#   week in 2021-07-05..2023-11-27 (126 weeks) and 5 distinct tokens from that week's universe with a known
#   next-week return. The SAME 2000 sets for every variant. Names, dates and price levels hidden.
# Variants (one Jev Choice call per set per variant, letters A-E):
#   V0 full:   all 19 inputs, each with a plain definition, value and percentile in that week's universe.
#              "Which token will have the highest price return over the next 7 days?"
#   V1 plain:  same question; each available input as one word bucket by percentile (very low <=20, low
#              <=40, middle <=60, high <=80, very high), missing inputs omitted.
#   V2 note:   V0 cards plus a track record: each input's mean weekly rank IC with next-week return over
#              weeks whose label ended by the decision (2021-01 onward; walk-forward), with t, in words.
#              No token names, no returns of any set.
#   V3 avoid:  V0 cards; "which token will have the LOWEST price return over the next 7 days?"
#   V4 month:  V0 cards; "highest price return over the next 4 weeks?" Labels: the market's own builder
#              with horizon 28 bars (same entry and delisting rule).
# PRIMARY per variant (judged; Jev's pick = its highest-probability letter):
#   V0-V2, V4: mean over sets of (pick return - the set's average return). V3: mean of (set average -
#   avoided token's return). t clusters by decision week (V4: by 8-week block, horizons overlap).
#   Kept if t >= 2.91 and the mean > 0. Five registry rows (kind test), kept or not.
# Secondary (not judged): hit rate vs 20%; mean rank of pick; free comparisons on the same sets (lowest
#   px_vol_4w; an IC-weighted score from the V2 note); calibration: hit rate by Jev's top probability
#   (<0.4, 0.4-0.7, 0.7-0.9, >=0.9). Returns spot close to close, before costs (~46 bp round trip).
# Power (random-pick sd from the sets, before any call): 1 week sd 10.5%, SE 0.25%, MDE 0.74% (50%) /
#   0.96% (80%); 4 weeks sd 22.0%, SE 0.29%, MDE 0.86% / 1.11%. For scale: an input with the engine's best
#   rank IC (0.083) would earn ~1%/wk picking 1 of 5, so only an edge at least that good is detectable.
# Already known: every input's IC on these years (combo.py, descriptive); the 5-set demo. Unseen: any Jev
#   answer on these sets. Jev is not trained on customer requests (docs.typesafe.ai/models), and each call
#   is stateless, so answers in one variant cannot inform another.
# Budget: ledger step jev_decider; ~10,000 calls, ~$1.5 projected; the run stops itself above $3.
# AMENDMENT to pre-registration 6 (2026-10-12, before any call): V1 shows hack_usd_30d = 0 as "none" rather than
#   its tied percentile bucket ("middle"). Nothing else changes.
