# Bring your own data (engine/markets/csv.py): 30 tokens trading 24/7 with planted signals,
# generated by examples/csv/make_example.py. Copy this file, point `csv:` at your files, then:
#   uv run engine report --market csv_example --features all
#   uv run engine test   --market csv_example --feature flow
plugin: csv

csv:
  prices: examples/csv/prices.csv          # entity, date, close [, volume] [, group]
  signals: examples/csv/signals.csv        # entity, available_at, feature, value
  documents: examples/csv/documents.csv    # entity, available_at, doc_type, text
  cost_bps: 20                             # round trip
  delisted_return: -0.5                    # added to a window cut short when a series stops for good
  max_stale_days: 3                        # in the universe only while it trades

calendar: {kind: continuous, close: "23:59", decide_after_close: 1min}   # bars close 23:59 UTC
schedule: weekly                           # decisions Monday 00:00 UTC
labels: {horizon: 7}                       # bars: one week

sources:
  signals:
    max_age_days: 6                        # last week's value only
  posts:
    type: text
    max_age_days: 6
    params:
      documents: csv
      questions: examples/csv/questions.yaml
      reader: {kind: keyword}              # free; {kind: claude} or {kind: jev} with keys
      prefix: doc
      change: false
      surprise: false

features:
  baseline: []                             # a candidate is judged on its own rank IC
  all: [flow, social, doc_upgrade_p, doc_exploit_p]

model:
  name: ridge
  alpha: 10.0
  block: Q                                 # refit each quarter
  min_train_periods: 12

portfolio:
  band: {enter: 0.8, exit: 0.6}

periods:                                   # decide these BEFORE looking at results
  tuning: ["2021-01-01", "2023-01-01"]
  check: ["2023-01-01", "2023-07-01"]
  holdout_start: "2023-07-01"

registry:
  file: .engine_cache/csv_example/registry.csv   # an example: its tests aren't research
  holdout_unlock_log: .engine_cache/csv_example/holdout_unlocks.csv
  check_limit: 30

discovery:
  transforms: [level]
  max_tests: 4

loop:                   # `engine loop --market csv_example`
  features: all
  refit: M
